<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeraFast Play</title>
<meta name="theme-color" content="#0b0c10">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="top-row">
      <div class="logo-mark" aria-hidden="true"></div>
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <span class="s-ico" data-ico="search"></span>
        <input id="searchInput" type="search" placeholder="Search movie / series" aria-label="Search">
        <button class="search-btn" type="submit">Search</button>
      </form>
    </div>
    <nav class="tabs" id="tabs" aria-label="Browse"></nav>
  </header>
  <main id="main"></main>
  <nav class="bottom-nav" id="bottomNav" aria-label="Primary">
    <button data-nav="home" class="active" type="button"><span class="bn-ico" data-ico="home"></span><span>Home</span></button>
    <button data-nav="downloads" type="button"><span class="bn-ico" data-ico="download"></span><span>Downloads</span></button>
    <button data-nav="me" type="button"><span class="bn-ico" data-ico="user"></span><span>Me</span></button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
</div>
<section class="player hidden" id="player" aria-label="Video player"></section>
<div class="sheet hidden" id="sheet" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
