<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0f13">
<title>TeraFastPlay</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <div class="logo"><span class="logo-mark"></span><b>TeraFast</b>Play</div>
      <button class="avatar" id="avatarBtn" aria-label="Account">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
    </div>
    <form class="search" id="searchForm">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="searchInput" type="search" placeholder="মুভি, সিরিজ খুঁজুন" autocomplete="off">
    </form>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-nav="home" class="active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button data-nav="downloads">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v7m0 0l-3-3m3 3l3-3"/></svg>
      <span>Downloads</span>
    </button>
    <button data-nav="me">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Me</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<!-- লগইন মডাল: ক্রস নেই, বাইরে ক্লিক করলে বন্ধ -->
<div class="overlay hidden" id="loginOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <h2 id="loginTitle">লগইন করুন</h2>
    <p class="sub" id="loginSub">প্লে করতে লগইন দরকার। লগইন ছাড়া ব্রাউজ করতে পারবেন।</p>
    <form id="loginForm" autocomplete="on">
      <label class="field" id="nameField" style="display:none">
        <span>নাম</span><input name="name" type="text" autocomplete="name">
      </label>
      <label class="field">
        <span>ইমেইল</span><input name="email" type="email" required autocomplete="email">
      </label>
      <label class="field">
        <span>পাসওয়ার্ড</span><input name="password" type="password" required minlength="6" autocomplete="current-password">
      </label>
      <p class="err" id="loginErr"></p>
      <button class="btn-primary" type="submit" id="loginSubmit">লগইন</button>
    </form>
    <button class="link" id="toggleMode" type="button">নতুন অ্যাকাউন্ট খুলুন</button>
  </div>
</div>

<div class="overlay hidden" id="detailOverlay">
  <div class="sheet detail" id="detailSheet"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
